name: Run SQL migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environnement Supabase
        required: true
        type: choice
        options:
          - staging
          - production
      sql_file:
        description: Fichier SQL (relatif à la racine du dépôt)
        required: true
        default: supabase/migrations/20260523150000_round_product_prices_clear_user_carts.sql

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target == 'staging' && 'staging' || 'main' }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run SQL on Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_2 || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target }}"
          SQL_FILE="${{ inputs.sql_file }}"

          if [[ ! -f "$SQL_FILE" ]]; then
            echo "Fichier introuvable: $SQL_FILE" >&2
            exit 1
          fi

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Secret manquant : définir SUPABASE_ACCESS_TOKEN_2 ou SUPABASE_ACCESS_TOKEN." >&2
            exit 1
          fi

          case "$TARGET" in
            staging)
              PROJECT_REF="${{ secrets.SUPABASE_REF_STAGING }}"
              if [[ -z "$PROJECT_REF" ]]; then PROJECT_REF="lhrwjnieojuempxjbgql"; fi
              ;;
            production)
              PROJECT_REF="${{ secrets.SUPABASE_REF_PRODUCTION }}"
              if [[ -z "$PROJECT_REF" ]]; then PROJECT_REF="lqsbsinycyewdvdtbruy"; fi
              ;;
            *)
              echo "Cible invalide: $TARGET" >&2
              exit 1
              ;;
          esac

          echo "Projet: $PROJECT_REF — fichier: $SQL_FILE"
          supabase link --project-ref "$PROJECT_REF" --yes
          supabase db query --linked -f "$SQL_FILE"
