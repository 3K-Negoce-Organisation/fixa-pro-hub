name: KPMC import documents local (OneDrive)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KPMC
        uses: actions/checkout@v4
        with:
          repository: 3K-Negoce-Organisation/KPMC
          path: kpmc
          token: ${{ secrets.KPMC_REPO_CHECKOUT_TOKEN }}

      - name: Checkout documents bundle
        uses: actions/checkout@v4
        with:
          repository: 3K-Negoce-Organisation/KPMC
          path: docs-bundle
          sparse-checkout: |
            data/documents-bundle
          sparse-checkout-cone-mode: false
          token: ${{ secrets.KPMC_REPO_CHECKOUT_TOKEN }}
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kpmc/app/package-lock.json

      - working-directory: kpmc/app
        run: npm ci

      - name: Resolve Supabase service_role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_2 }}
        run: |
          set -euo pipefail
          KEYS=$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/lhrwjnieojuempxjbgql/api-keys")
          SERVICE=$(echo "$KEYS" | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://lhrwjnieojuempxjbgql.supabase.co" >> "$GITHUB_ENV"

      - name: Import from bundle if present
        working-directory: kpmc/app
        run: |
          if [[ -d ../../docs-bundle/data/documents-bundle ]]; then
            LOCAL_DOCUMENTS_ROOT="../../docs-bundle/data/documents-bundle" npm run import:documents-local
          else
            echo "Pas de bundle documents dans le dépôt — lancer localement avec LOCAL_DOCUMENTS_ROOT"
            exit 0
          fi
