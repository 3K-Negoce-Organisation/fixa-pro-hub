name: KPMC apply Supabase schema

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environnement Supabase
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - staging
    paths:
      - "supabase/migrations/202606*kpmc*.sql"
      - ".github/workflows/kpmc-apply-schema.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'staging' || (inputs.target == 'staging' && 'staging' || 'main') }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply kpmc migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_2 || secrets.SUPABASE_ACCESS_TOKEN }}
          DEPLOY_TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
        run: |
          set -euo pipefail
          case "${DEPLOY_TARGET}" in
            staging)
              PROJECT_REF="${{ secrets.SUPABASE_REF_STAGING }}"
              if [[ -z "$PROJECT_REF" ]]; then PROJECT_REF="lhrwjnieojuempxjbgql"; fi
              ;;
            production)
              PROJECT_REF="${{ secrets.SUPABASE_REF_PRODUCTION }}"
              if [[ -z "$PROJECT_REF" ]]; then PROJECT_REF="lqsbsinycyewdvdtbruy"; fi
              ;;
          esac
          shopt -s nullglob
          files=()
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              mapfile -t files < <(git show --pretty='' --name-only --diff-filter=AM "${{ github.sha }}" -- 'supabase/migrations/202606*kpmc*.sql')
            else
              mapfile -t files < <(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'supabase/migrations/202606*kpmc*.sql')
            fi
          else
            mapfile -t files < <(git log -1 --pretty='' --name-only -- 'supabase/migrations/202606*kpmc*.sql')
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Aucune migration kpmc à appliquer pour cet événement."
            exit 0
          fi
          echo "Cible: $PROJECT_REF — ${#files[@]} fichier(s) : ${files[*]}"
          supabase link --project-ref "$PROJECT_REF" --yes
          for sql in "${files[@]}"; do
            echo "→ $sql"
            supabase db query --linked -f "$sql"
          done
          echo "✓ ${#files[@]} migration(s) kpmc appliquée(s)"
