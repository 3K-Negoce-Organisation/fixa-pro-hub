name: KPMC import documents Storage

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation sans upload"
        type: boolean
        default: false
      limit:
        description: "Nombre max de fichiers (vide = tous)"
        type: string
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KPMC
        uses: actions/checkout@v4
        with:
          repository: 3K-Negoce-Organisation/KPMC
          path: kpmc
          token: ${{ secrets.KPMC_REPO_CHECKOUT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kpmc/app/package-lock.json

      - name: Install dependencies
        working-directory: kpmc/app
        run: npm ci

      - name: Resolve Supabase service_role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_2 }}
        run: |
          set -euo pipefail
          KEYS=$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/lhrwjnieojuempxjbgql/api-keys")
          SERVICE=$(echo "$KEYS" | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [[ -z "$SERVICE" || "$SERVICE" == "null" ]]; then
            echo "Impossible de récupérer service_role" >&2
            exit 1
          fi
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://lhrwjnieojuempxjbgql.supabase.co" >> "$GITHUB_ENV"

      - name: Setup SSH key
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.KPMC_HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${HOSTINGER_SSH_KEY}" ]]; then
            echo "Secret KPMC_HOSTINGER_SSH_KEY manquant sur fixa-pro-hub" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${HOSTINGER_SSH_KEY}" | tr -d '\r' > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          echo 'HOSTINGER_SSH_KEY_FILE='"$HOME/.ssh/hostinger_key" >> "$GITHUB_ENV"

      - name: Copy GED to Storage
        working-directory: kpmc/app
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "${{ inputs.limit }}" ]]; then
            args+=(--limit="${{ inputs.limit }}")
          fi
          npm run import:documents-storage -- "${args[@]}"
