# Exemple nginx — redirections SEO vers le domaine canonique
# À adapter selon l'hébergement Railway / reverse proxy

server {
    listen 443 ssl;
    server_name vis-a-bois.fr www.vis-a-bois.fr vis-a-bois.com;

    return 301 https://www.vis-a-bois.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.vis-a-bois.com;

    root /usr/share/nginx/html;
    index index.html;

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
